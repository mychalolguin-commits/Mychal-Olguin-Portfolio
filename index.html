    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Display + body: Manrope, crisp enough for proof-led work and still
         natural in paragraphs.
         Figures and labels: JetBrains Mono, the only face allowed to set a
         number. The mono gives the site its measurement voice without letting
         the whole thing turn technical. -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
    <style>
      /* The fixed palette is the single source of truth. Semantic tokens
         below map it to light and dark themes without adding decorative hues. */
      :root {
        --palette-canvas: #F3F3F0;
        --palette-surface: #E8E9E4;
        --palette-ink: #111210;
        --palette-muted: #686A64;
        --palette-border: #D9DAD5;
        --palette-brand: #0F5D45;
        --palette-brand-hover: #0B4B38;
        --palette-dark: #101310;
        --palette-dark-text: #F4F4F1;
        --palette-dark-muted: #B8BBB5;
        --palette-dark-border: #343934;
        --palette-dark-surface: #191D19;
        --palette-dark-elevated: #202520;
        --palette-surface-muted: #646660;
        --palette-dark-control: #2D322D;

        --paper: var(--palette-canvas);
        --ink: var(--palette-ink);
        --graphite: var(--palette-muted);
        --rule: var(--palette-border);
        --signal-up: var(--palette-brand);
        --signal-down: #A8442F;

        --color-bg-base: var(--paper);
        --color-bg-elevated: var(--palette-surface);
        --color-bg-muted: var(--palette-surface);
        --color-surface2: var(--palette-surface);

        --color-text-primary: var(--ink);
        --color-text-secondary: var(--ink);
        --color-text-tertiary: var(--graphite);
        --color-text-muted: var(--graphite);

        --color-border-subtle: var(--rule);
        --color-border-default: var(--rule);
        --color-border-hover: var(--ink);

        --color-nav-bg: rgba(243, 243, 240, 0.92);

        --color-accent: var(--palette-brand);
        --color-accent-dark: var(--palette-brand-hover);
        --color-accent-subtle: rgba(15, 93, 69, 0.07);

        --color-scrollbar-track: var(--paper);
        --color-scrollbar-thumb: var(--palette-border);
        --color-scrollbar-hover: var(--graphite);

        /* Atmosphere effects are switched off, not deleted, so any
           markup still referencing them renders flat instead of broken. */
        --color-orb-opacity: 0;
        --gridOpacity: 0;
        --noiseOpacity: 0;
        --glow: transparent;
        --glowStrong: transparent;

        --shadow-sm: none;
        --shadow-md: none;
        --shadow-lg: none;
        --shadow-card: none;
        --shadow-card-hover: none;
        --shadowElev: none;
        --cardLift: none;

        --card-border: var(--rule);
        --card-border-hover: var(--ink);
        --card-highlight: none;
        --borderGlow: var(--ink);
        --surfaceHover: rgba(17, 18, 16, 0.035);
        --textHover: var(--ink);


        /* Data palette. Two hues only, and that is deliberate: five
           categorical colors cannot be told apart by a red-green colorblind
           reader no matter how they are stepped (blue and purple collide
           under deuteranopia). Charts here carry identity in the row label
           and use color only for measure — volume vs cost. Both hues are
           validated for lightness, chroma, CVD separation, and 3:1 contrast
           against this surface. Re-validate before changing either. */
        --data-1: var(--palette-brand);  /* volume — sessions, views, reach */
        --data-2: #255F96;  /* cost — spend, CPM, cost per action */

        /* Status, reserved. Never reused as a series color. */
        --status-warn: #835200;

        --brand: var(--palette-brand);
        --brand-strong: var(--palette-brand-hover);
        --on-brand: var(--palette-dark-text);

        /* Closing fields use the dark neutral. Green remains an interaction cue. */
        --brand-field: var(--palette-dark);
        --on-brand-field: var(--palette-dark-text);
        --on-brand-muted: var(--palette-dark-muted);

        --surface-sunken: var(--palette-surface);
      }

      [data-theme="dark"] {
        --paper: var(--palette-dark-surface);
        --ink: var(--palette-dark-text);
        --graphite: var(--palette-dark-muted);
        --rule: var(--palette-dark-border);
        --signal-up: #26785D;
        --signal-down: #D97860;

        --color-bg-elevated: var(--palette-dark-elevated);
        --color-bg-muted: var(--palette-dark);
        --color-surface2: var(--palette-dark-elevated);

        --color-text-secondary: var(--ink);
        --color-text-tertiary: var(--graphite);

        --color-border-subtle: var(--rule);
        --color-nav-bg: rgba(25, 29, 25, 0.92);
        --color-accent-subtle: rgba(117, 190, 160, 0.1);

        --color-scrollbar-thumb: #454B45;

        --surfaceHover: rgba(244, 244, 241, 0.045);

        /* Stepped for the dark surface, not flipped from light — both
           re-validated against #12110F. */
        --data-1: #75BEA0;
        --data-2: #6CA2DA;

        --status-warn: #D4A845;

        /* A slightly lifted forest green clears control contrast on dark. */
        --brand: #26785D;
        --brand-strong: #34795F;
        --on-brand: var(--palette-dark-text);

        --brand-field: var(--palette-dark);
        --on-brand-field: var(--palette-dark-text);
        --on-brand-muted: var(--palette-dark-muted);

        --surface-sunken: var(--palette-dark-elevated);
      }

      body {
        background-color: var(--paper);
        color: var(--color-text-secondary);
        font-family: 'Manrope', sans-serif;
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* ── Type roles ───────────────────────────────────────────── */

      /* Headlines. Manrope is clean and a little tighter than DM Sans without
         pushing the site into hard-edged product typography. */
      .display {
        font-family: 'Manrope', sans-serif;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.06;
      }

      /* The hero statement and section openers: held to a short measure so the
         line breaks land where the sentence breathes. */
      .statement {
        font-family: 'Manrope', sans-serif;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.06;
        text-wrap: balance;
      }

      /* Every number on the site goes through this. Tabular figures are
         what let a column of metrics line up and be scanned. */
      .figure {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
      }

      /* Small caps-style label for column heads and row keys. */
      .label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0;
        text-transform: uppercase;
        color: var(--graphite);
      }

      /* ── Ruled table primitives ───────────────────────────────── */
      .ruled-row {
        border-top: 1px solid var(--rule);
        transition: background-color 0.15s ease;
      }
      .ruled-row:hover {
        background-color: var(--surfaceHover);
      }

      /* ── Accessibility floor ──────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
        border-radius: 1px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--color-scrollbar-track); }
      ::-webkit-scrollbar-thumb {
        background: var(--color-scrollbar-thumb);
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-hover); }

      ::selection {
        background: var(--ink);
        color: var(--paper);
      }

      .surface-muted { background-color: var(--color-bg-muted); }
      .surface-2 { background-color: var(--color-surface2); }

      .bg-accent-subtle { background-color: var(--color-accent-subtle); }
      .border-theme { border-color: var(--rule); }
      .border-theme-hover:hover { border-color: var(--ink); }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
