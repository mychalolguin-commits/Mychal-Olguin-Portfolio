    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Display + body: DM Sans, a geometric grotesque with round bowls and a
         tall x-height. It carries the warmth and calm the site is built around.
         Figures and labels: JetBrains Mono, the only face allowed to set a
         number. That pairing is the whole system — warm geometry for language,
         technical mono for measurement. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* ═══════════════════════════════════════════════════════════
         INSTRUMENT PANEL

         Six tokens are the source of truth. Everything else on this
         page derives from them.

         The rule that holds the design together: COLOUR ENCODES DATA,
         NEVER DECORATION. --signal-up / --signal-down appear only on a
         real change in a real number, and --data-* only inside charts.
         Nothing else is coloured — links, hovers, active states and
         focus rings are all ink. Adding a decorative accent colour
         anywhere breaks the design.

         LIGHT IS THE DEFAULT (:root). Dark is a designed second theme.
         The pre-paint script above always writes data-theme, so :root
         serves light and [data-theme="dark"] overrides it.
         ═══════════════════════════════════════════════════════════ */
      :root {
        --paper:       #FAF9F5;
        --ink:         #141413;
        --graphite:    #6B6A65;
        --rule:        #E3E1DA;
        --signal-up:   #1F7A4D;
        --signal-down: #B4472E;

        /* ── Legacy token names, re-pointed at the palette above ──
           ~430 usages across pages/ and components/ still reference
           these. Keeping them mapped means every page that hasn't been
           rebuilt yet adopts the new palette without being touched. */

        /* Core surfaces */
        --color-bg-base: var(--paper);
        --color-bg-elevated: #FFFFFF;
        --color-bg-muted: #F2F0EA;
        --color-surface2: #EAE7DE;

        /* Text hierarchy */
        --color-text-primary: var(--ink);
        --color-text-secondary: #3A3934;
        --color-text-tertiary: #57564F;
        --color-text-muted: var(--graphite);

        /* Borders */
        --color-border-subtle: rgba(20, 20, 19, 0.07);
        --color-border-default: var(--rule);
        --color-border-hover: var(--ink);

        /* Navigation */
        --color-nav-bg: rgba(250, 249, 245, 0.88);

        /* "Accent" is ink now — colour is reserved for data. */
        --color-accent: var(--ink);
        --color-accent-dark: var(--graphite);
        --color-accent-subtle: rgba(20, 20, 19, 0.05);

        /* Scrollbar */
        --color-scrollbar-track: var(--paper);
        --color-scrollbar-thumb: #D5D2C9;
        --color-scrollbar-hover: var(--graphite);

        /* Atmosphere effects are switched off, not deleted, so any
           markup still referencing them renders flat instead of broken. */
        --color-orb-opacity: 0;
        --gridOpacity: 0;
        --noiseOpacity: 0;
        --glow: transparent;
        --glowStrong: transparent;

        /* Elevation: this design uses rules, not shadows. */
        --shadow-sm: none;
        --shadow-md: none;
        --shadow-lg: none;
        --shadow-card: none;
        --shadow-card-hover: none;
        --shadowElev: none;
        --cardLift: none;

        /* Card styling */
        --card-border: var(--rule);
        --card-border-hover: var(--ink);
        --card-highlight: none;
        --borderGlow: var(--ink);
        --surfaceHover: rgba(20, 20, 19, 0.03);
        --textHover: var(--ink);


        /* Data palette. Two hues only, and that is deliberate: five
           categorical colors cannot be told apart by a red-green colorblind
           reader no matter how they are stepped (blue and purple collide
           under deuteranopia). Charts here carry identity in the row label
           and use color only for measure — volume vs cost. Both hues are
           validated for lightness, chroma, CVD separation, and 3:1 contrast
           against this surface. Re-validate before changing either. */
        --data-1: #1F7A4D;  /* volume — sessions, views, reach */
        --data-2: #1D5FA8;  /* cost — spend, CPM, cost per action */

        /* Status, reserved. Never reused as a series color. */
        --status-warn: #8A5A00;

        /* ── The one hue ────────────────────────────────────────────
           Deep pine. It has exactly one meaning — forward — and appears
           on primary actions, the active nav marker, focus rings, and the
           single full-bleed closing field. It is the same family as
           --data-1 (volume) and --signal-up (growth), so every green on
           the site points the same direction.

           What it must never become: a link colour, a hover tint, a
           gradient, a border on everything, or a background for cards.
           That spray-on treatment is what made the old mint accent read
           as AI-generated. One hue, one meaning, a handful of places.
           7.33:1 against --on-brand. */
        --brand:        #1B5E3F;
        --brand-strong: #175239;  /* hover / pressed */
        --on-brand:     #FAF9F5;

        /* The closing field is its own pair. A colour sized for a button is
           not a colour you can flood a viewport with — see the dark block,
           where the interactive green is bright and the field green is not.
           7.33:1. */
        --brand-field:    #1B5E3F;
        --on-brand-field: #FAF9F5;
        /* A real rgba, not an opacity modifier: Tailwind cannot apply an
           alpha channel to an arbitrary var() colour. */
        --on-brand-muted: rgba(250, 249, 245, 0.45);

        /* A barely-there tint — 1.06:1 against paper. Enough to separate
           one band from the next without drawing a line. */
        --surface-sunken: #F1F3EE;
      }

      [data-theme="dark"] {
        --paper:       #12110F;
        --ink:         #F2F0EA;
        --graphite:    #8F8D86;
        --rule:        #2A2823;
        --signal-up:   #4EAE7C;
        --signal-down: #D4735A;

        --color-bg-elevated: #1A1815;
        --color-bg-muted: #171512;
        --color-surface2: #211E1A;

        --color-text-secondary: #D8D5CC;
        --color-text-tertiary: #B3B0A8;

        --color-border-subtle: rgba(242, 240, 234, 0.08);
        --color-nav-bg: rgba(18, 17, 15, 0.88);
        --color-accent-subtle: rgba(242, 240, 234, 0.06);

        --color-scrollbar-thumb: #33302A;

        --surfaceHover: rgba(242, 240, 234, 0.04);

        /* Stepped for the dark surface, not flipped from light — both
           re-validated against #12110F. */
        --data-1: #35A971;
        --data-2: #5590D8;

        --status-warn: #D4A845;

        /* Dark inverts the relationship: a bright fill carrying dark type,
           rather than a dark fill carrying light type. 6.35:1. */
        --brand:        #35A971;
        --brand-strong: #45B77F;
        --on-brand:     #12110F;

        /* Deliberately NOT the bright interactive green. A full viewport of
           #35A971 is the loud, sprayed-on look this palette exists to avoid;
           at field scale the green has to recede. 6.97:1. */
        --brand-field:    #1A5C3E;
        --on-brand-field: #F2F0EA;
        --on-brand-muted: rgba(242, 240, 234, 0.4);

        --surface-sunken: #171917;
      }

      body {
        background-color: var(--paper);
        color: var(--color-text-secondary);
        font-family: 'DM Sans', sans-serif;
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* ── Type roles ───────────────────────────────────────────── */

      /* Headlines. Medium weight, not bold — at the sizes this is used,
         weight reads as shouting and the size already carries the emphasis.
         Tracking is negative because geometric faces open up as they grow. */
      .display {
        font-family: 'DM Sans', sans-serif;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.06;
      }

      /* The hero statement and section openers: set centred, generously
         leaded, and held to a short measure so the line breaks land where
         the sentence breathes rather than wherever the container ends. */
      .statement {
        font-family: 'DM Sans', sans-serif;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.12;
        text-wrap: balance;
      }

      /* Every number on the site goes through this. Tabular figures are
         what let a column of metrics line up and be scanned. */
      .figure {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
      }

      /* Small caps-style label for column heads and row keys. */
      .label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--graphite);
      }

      /* ── Ruled table primitives ───────────────────────────────── */
      .ruled-row {
        border-top: 1px solid var(--rule);
        transition: background-color 0.15s ease;
      }
      .ruled-row:hover {
        background-color: var(--surfaceHover);
      }

      /* ── Accessibility floor ──────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
        border-radius: 1px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--color-scrollbar-track); }
      ::-webkit-scrollbar-thumb {
        background: var(--color-scrollbar-thumb);
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-hover); }

      ::selection {
        background: var(--ink);
        color: var(--paper);
      }

      .surface-muted { background-color: var(--color-bg-muted); }
      .surface-2 { background-color: var(--color-surface2); }

      .bg-accent-subtle { background-color: var(--color-accent-subtle); }
      .border-theme { border-color: var(--rule); }
      .border-theme-hover:hover { border-color: var(--ink); }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
