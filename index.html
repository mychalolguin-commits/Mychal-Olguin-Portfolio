    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      })();
    </script>

    <!-- Display: Archivo (expanded widths for the masthead). Body: Inter Tight.
         Figures: JetBrains Mono, which is the only face allowed to set a number. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: 'var(--paper)',
              ink: 'var(--ink)',
              graphite: 'var(--graphite)',
              rule: 'var(--rule)',
              'signal-up': 'var(--signal-up)',
              'signal-down': 'var(--signal-down)',
              // Legacy alias. Work / WorkDetail / Resume / Contact still carry
              // ~40 `mint-*` classes and are awaiting their own design pass;
              // without this they'd render as invisible or default-bordered
              // elements. Re-pointed at the data green so they stay coherent.
              // Remove once those pages are rebuilt.
              mint: {
                300: '#4EAE7C',
                400: '#2E9160',
                500: '#1F7A4D',
                600: '#17603C',
                900: '#0C3121',
              },
            },
            fontFamily: {
              // `display` is Archivo stretched wide — see .display-wide below.
              display: ['Archivo', 'sans-serif'],
              sans: ['Inter Tight', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.7s ease-out forwards',
              'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>
    <style>
      /* ═══════════════════════════════════════════════════════════
         INSTRUMENT PANEL

         Six tokens are the source of truth. Everything else on this
         page derives from them.

         The rule that holds the design together: COLOUR ENCODES DATA,
         NEVER DECORATION. --signal-up / --signal-down appear only on a
         real change in a real number, and --data-* only inside charts.
         Nothing else is coloured — links, hovers, active states and
         focus rings are all ink. Adding a decorative accent colour
         anywhere breaks the design.

         LIGHT IS THE DEFAULT (:root). Dark is a designed second theme.
         The pre-paint script above always writes data-theme, so :root
         serves light and [data-theme="dark"] overrides it.
         ═══════════════════════════════════════════════════════════ */
      :root {
        --paper:       #FAF9F5;
        --ink:         #141413;
        --graphite:    #6B6A65;
        --rule:        #E3E1DA;
        --signal-up:   #1F7A4D;
        --signal-down: #B4472E;

        /* ── Legacy token names, re-pointed at the palette above ──
           ~430 usages across pages/ and components/ still reference
           these. Keeping them mapped means every page that hasn't been
           rebuilt yet adopts the new palette without being touched. */

        /* Core surfaces */
        --color-bg-base: var(--paper);
        --color-bg-elevated: #FFFFFF;
        --color-bg-muted: #F2F0EA;
        --color-surface2: #EAE7DE;

        /* Text hierarchy */
        --color-text-primary: var(--ink);
        --color-text-secondary: #3A3934;
        --color-text-tertiary: #57564F;
        --color-text-muted: var(--graphite);

        /* Borders */
        --color-border-subtle: rgba(20, 20, 19, 0.07);
        --color-border-default: var(--rule);
        --color-border-hover: var(--ink);

        /* Navigation */
        --color-nav-bg: rgba(250, 249, 245, 0.88);

        /* "Accent" is ink now — colour is reserved for data. */
        --color-accent: var(--ink);
        --color-accent-dark: var(--graphite);
        --color-accent-subtle: rgba(20, 20, 19, 0.05);

        /* Scrollbar */
        --color-scrollbar-track: var(--paper);
        --color-scrollbar-thumb: #D5D2C9;
        --color-scrollbar-hover: var(--graphite);

        /* Atmosphere effects are switched off, not deleted, so any
           markup still referencing them renders flat instead of broken. */
        --color-orb-opacity: 0;
        --gridOpacity: 0;
        --noiseOpacity: 0;
        --glow: transparent;
        --glowStrong: transparent;

        /* Elevation: this design uses rules, not shadows. */
        --shadow-sm: none;
        --shadow-md: none;
        --shadow-lg: none;
        --shadow-card: none;
        --shadow-card-hover: none;
        --shadowElev: none;
        --cardLift: none;

        /* Card styling */
        --card-border: var(--rule);
        --card-border-hover: var(--ink);
        --card-highlight: none;
        --borderGlow: var(--ink);
        --surfaceHover: rgba(20, 20, 19, 0.03);
        --textHover: var(--ink);

        /* Section washes — neutralised. */
        --wash-hero: none;
        --wash-section: none;
        --wash-cta: none;

        /* Data palette. Muted and editorial so it sits on warm paper
           without shouting; still five distinguishable hues. */
        --data-1: #1F7A4D;
        --data-2: #2F5D8C;
        --data-3: #A67C1A;
        --data-4: #6A5192;
        --data-5: #B4472E;
      }

      [data-theme="dark"] {
        --paper:       #12110F;
        --ink:         #F2F0EA;
        --graphite:    #8F8D86;
        --rule:        #2A2823;
        --signal-up:   #4EAE7C;
        --signal-down: #D4735A;

        --color-bg-elevated: #1A1815;
        --color-bg-muted: #171512;
        --color-surface2: #211E1A;

        --color-text-secondary: #D8D5CC;
        --color-text-tertiary: #B3B0A8;

        --color-border-subtle: rgba(242, 240, 234, 0.08);
        --color-nav-bg: rgba(18, 17, 15, 0.88);
        --color-accent-subtle: rgba(242, 240, 234, 0.06);

        --color-scrollbar-thumb: #33302A;

        --surfaceHover: rgba(242, 240, 234, 0.04);

        --data-1: #4EAE7C;
        --data-2: #7BA3D0;
        --data-3: #D4A845;
        --data-4: #A08FC7;
        --data-5: #D4735A;
      }

      body {
        background-color: var(--paper);
        color: var(--color-text-secondary);
        font-family: 'Inter Tight', sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* ── Type roles ───────────────────────────────────────────── */

      /* Archivo at its widest. The masthead register: expanded
         grotesques are what report and statement covers are set in. */
      .display-wide {
        font-family: 'Archivo', sans-serif;
        font-stretch: 125%;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.02;
      }

      /* Every number on the site goes through this. Tabular figures are
         what let a column of metrics line up and be scanned. */
      .figure {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
      }

      /* Small caps-style label for column heads and row keys. */
      .label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--graphite);
      }

      /* ── Ruled table primitives ───────────────────────────────── */
      .ruled-row {
        border-top: 1px solid var(--rule);
        transition: background-color 0.15s ease;
      }
      .ruled-row:hover {
        background-color: var(--surfaceHover);
      }

      /* ── Accessibility floor ──────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
        border-radius: 1px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--color-scrollbar-track); }
      ::-webkit-scrollbar-thumb {
        background: var(--color-scrollbar-thumb);
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-hover); }

      ::selection {
        background: var(--ink);
        color: var(--paper);
      }

      /* ── Neutralised legacy utilities ─────────────────────────────
         Still referenced by pages awaiting their own pass. Defined as
         no-ops so those pages render flat rather than broken. */
      .bg-noise { background-image: none; }
      .wash-hero, .wash-section, .wash-cta { background-image: none; }

      .card-elevated {
        background-color: var(--color-bg-elevated);
        border: 1px solid var(--rule);
        transition: border-color 0.2s ease;
      }
      .card-elevated:hover { border-color: var(--ink); }

      /* Surface variants */
      .surface-base { background-color: var(--paper); }
      .surface-elevated { background-color: var(--color-bg-elevated); }
      .surface-muted { background-color: var(--color-bg-muted); }
      .surface-2 { background-color: var(--color-surface2); }

      .bg-accent-subtle { background-color: var(--color-accent-subtle); }
      .border-theme { border-color: var(--rule); }
      .border-theme-hover:hover { border-color: var(--ink); }
    </style>
